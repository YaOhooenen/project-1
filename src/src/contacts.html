<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
 <link rel="stylesheet" href="style.css">
 <script src="logic.js" defer></script>
 <script src="phone.js"defer></script>
 <title>Контакты - Project-1</title>
 <meta name="description" content="Контакты">
</head>
<body>
 <header>
    <a class="site-header__brand" href="http://127.0.0.1:3000/src/src/index.html">Project-1</a>
 <!-- Главное меню навигации -->
 <nav>
 <ul>
 <li><a href="index.html">Главная</a></li>
 <li><a href="about.html">О нас</a></li>
 <li><a href="contacts.html">Контакты</a></li>
 </ul>
 </nav>
 </header>
 <main>
 <!-- Простые "хлебные крошки" -->
 <nav aria-label="Хлебные крошки">
 <a href="index.html">Главная</a> →
 <span>Контакты</span>
 </nav>
 <h1>О нашей компании</h1>
 <section>
 <h2>Наш телефон</h2>
 <p>+7 (999) 999-99-99</p>
 <h2>Наша команда:</h2>
 <p>Крутая команда из одного второкурсника МИРЭА.</p>
 </section>
 <!-- Кнопка открытия модалки -->
<button id="openDialog" type="button">Написать нам</button>
<!-- Модалка с формой -->
<dialog id="contactDialog" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle">Обратная связь</h2>
        <form id="contactForm" method="dialog" novalidate>
            <label for="name">Имя</label>
            <input id="name" name="name" type="text" required minlength="2"
            autocomplete="given-name">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required
            autocomplete="email">
            <label for="phone">Телефон</label>
            <input id="phone" name="phone" type="tel" inputmode="tel"
            autocomplete="tel"
            aria-describedby="phoneHelp" placeholder="+7 (999) 999-99-99"
            required pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$">
            <small id="phoneHelp">Формат: +7 (999) 999-99-99</small>
            <label for="date">Дата</label>
            <input id="date" name="date" type="date">
            <label for="topic">Тема</label>
            <select id="topic" name="topic" required>
                <option value="">Выберите тему</option>
                <option>Вопрос</option>
                <option>Заказ</option>
            </select>
            <label for="message">Сообщение</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            <div class="form-actions">
                <button type="button" id="closeDialog">Закрыть</button>
                <button type="submit">Отправить</button>
            </div>
        </form>
</dialog>
 </main>
 <footer>
 <p>&copy; 2025 Project-1. Все права защищены.</p>
 <p>Телефон: +7 (999) 999-99-99</p>
 </footer>
</body>
</html>
